name: r2-teardown

# One-off: empty and delete the old Cloudflare R2 bucket (storage migrated to
# Backblaze B2 on 2026-08-13, verified byte-identical). Manual dispatch only.
on:
  workflow_dispatch: {}

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet boto3
      - name: Empty and delete the R2 bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'EOF'
          import os, boto3
          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto")
          bucket = "fire-forecast-archive"
          deleted = 0
          while True:
              page = client.list_objects_v2(Bucket=bucket, MaxKeys=1000)
              objs = [{"Key": o["Key"]} for o in page.get("Contents", [])]
              if not objs:
                  break
              client.delete_objects(Bucket=bucket, Delete={"Objects": objs, "Quiet": True})
              deleted += len(objs)
              print(f"deleted {deleted} objects...", flush=True)
          client.delete_bucket(Bucket=bucket)
          print(f"DONE: {deleted} objects deleted, bucket removed")
          EOF
