name: collect

on:
  schedule:
    # hourly: pyrecast's publish lag grew to ~5-6h (files 403 while staging) and
    # retention shrank, so more attempts inside the narrow public window matter;
    # the poll interval also bounds worst-case granule loss
    - cron: "17 * * * *"
  workflow_dispatch: {}

# Single writer for manifest.json in the bucket — never run two collectors at
# once. Group renamed from "collect": a run wedged in GitHub's queue (cancel
# APIs 500'd) poisoned the old group and starved every scheduled run.
concurrency:
  group: collect-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # first run after enabling full ingestion backfills every listed run (~30-45
    # min); manifest checkpoints per fire make a timeout kill lose nothing
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests boto3 rasterio
      - name: Run collector
        env:
          # provider-agnostic (current: Backblaze B2)
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'fire-forecast-archive' }}
        run: python collect.py
