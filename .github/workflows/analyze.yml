name: analyze

on:
  schedule:
    - cron: "37 5,17 * * *"   # 2x daily, offset from the collect crons
  workflow_dispatch:
    inputs:
      skill_only:
        description: Only rebuild per-fire skill files from the published metrics.csv
        type: boolean
        default: false
      dry_run:
        description: Compute everything but publish nothing (results as a run artifact)
        type: boolean
        default: false
      only:
        description: "One fire's slug (e.g. ca-dome): score and publish just it (its skill file, start footprints, merged index); metrics.csv stays as published"
        type: string
        default: ""

concurrency:
  # a dry run never holds up (or waits for) the scheduled publishing runs
  group: analyze-${{ inputs.dry_run && 'dry' || 'live' }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # full recompute grows with the archive (~25min at 1.7k runs, 66-76min at 2.9k
    # in Nov; a 90-min limit cancelled Oct 31). Catch-up runs after a gap, or a
    # cold cache, also re-sync days of tifs. Minutes are free on a public repo.
    # a cold start (no cache: GitHub evicts past 10 GB per repo) re-downloads the archive;
    # Nov 9 that took 2h20m one file at a time (now in parallel), plus ~1h of scoring
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests boto3 rasterio shapely
      # raw/ holds the synced ToA tifs + perimeters (~1GB/day of archive age, ~10 GB in Nov);
      # the cache means most runs only download the delta from B2. Restore, sync, then save
      # right away, so even a run that later times out leaves main a warm cache. Only main's
      # publishing runs save: raw/ fills the repo's 10 GB cache budget alone, so a branch's or
      # a dry run's copy would evict main's (Nov 9-10: two cold runs timed out that way)
      - name: Restore raw/ (the synced archive)
        # inputs is empty on schedule events, so scheduled runs take this path
        if: ${{ !inputs.skill_only }}
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-analyze-${{ github.run_id }}
          restore-keys: raw-analyze-
      - name: Sync the archive into raw/
        if: ${{ !inputs.skill_only }}
        env:
          ONLY: ${{ inputs.only }}
        run: |
          [[ -z "$ONLY" || "$ONLY" =~ ^[a-z0-9-]+$ ]] || { echo "bad slug: $ONLY"; exit 1; }
          python analyze.py --sync-only ${ONLY:+--only "$ONLY"}
      - name: Save raw/ (main's publishing runs only)
        if: ${{ !inputs.skill_only && !inputs.dry_run && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-analyze-${{ github.run_id }}
      - name: "Dry run - analyze, publish nothing"
        if: ${{ inputs.dry_run && !inputs.skill_only }}
        env:
          ONLY: ${{ inputs.only }}
        run: |
          [[ -z "$ONLY" || "$ONLY" =~ ^[a-z0-9-]+$ ]] || { echo "bad slug: $ONLY"; exit 1; }
          python analyze.py ${ONLY:+--only "$ONLY"}
      - name: Dry run summary (vs the published metrics.csv)
        if: ${{ inputs.dry_run && !inputs.skill_only }}
        run: |
          curl -sf "https://f005.backblazeb2.com/file/fire-forecast-archive/metrics.csv" -o published.csv || true
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, collections, statistics, os
          new = [r for r in csv.DictReader(open("data/metrics.csv")) if r["percentile"] == "50"]
          old = [r for r in csv.DictReader(open("published.csv")) if r["percentile"] == "50"] if os.path.exists("published.csv") else []
          f = lambda x: float(x) if x not in ("", None) else None
          shown = [r for r in old if f(r.get("act_new_acres")) is not None and f(r["act_new_acres"]) >= 10
                   and abs(f(r.get("actual_offset_h")) or 0) <= 3 and (f(r.get("act_offgrid_frac")) or 0) <= 0.1]
          per = collections.Counter((r["slug"], r["run_ts"]) for r in new)
          per_old = collections.Counter((r["slug"], r["run_ts"]) for r in shown)
          runs = {(r["slug"], r["run_ts"]) for r in old} | set(per)
          print("## Exact-lead scoring dry run (50th percentile)")
          print("| | before (shown) | after |\n|---|---|---|")
          print(f"| scored rows | {len(shown)} | {len(new)} |")
          print(f"| runs with at least one score | {len(per_old)} | {len(per)} |")
          print(f"| scores per run, median | {statistics.median([per_old.get(k, 0) for k in runs]) if runs else 0} | {statistics.median([per.get(k, 0) for k in runs]) if runs else 0} |")
          print(f"| fires | {len({k[0] for k in per_old})} | {len({k[0] for k in per})} |")
          print("\nWhy each perimeter is scored:", dict(collections.Counter(r["chosen"] for r in new)))
          print("\nNo-growth rows (recall blank):", sum(1 for r in new if not r["recall"]))
          kept = {(r["slug"], r["run_ts"], r["actual_perim_ms"]) for r in shown}
          have = {(r["slug"], r["run_ts"], r["actual_perim_ms"]) for r in new}
          print(f"\nPreviously shown analyses still scored: {len(kept & have)} of {len(kept)}")
          EOF
          cat "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run && !inputs.skill_only }}
        with:
          name: dry-run
          retention-days: 7
          path: |
            data/metrics.csv
            data/skill
      - name: Analyze, publish metrics.csv + skill files to the bucket
        if: ${{ !inputs.skill_only && !inputs.dry_run }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'fire-forecast-archive' }}
          ONLY: ${{ inputs.only }}
        run: |
          [[ -z "$ONLY" || "$ONLY" =~ ^[a-z0-9-]+$ ]] || { echo "bad slug: $ONLY"; exit 1; }
          python analyze.py --publish ${ONLY:+--only "$ONLY"}
      - name: Rebuild skill files from the published metrics.csv
        if: ${{ inputs.skill_only }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'fire-forecast-archive' }}
        run: python analyze.py --skill-only
