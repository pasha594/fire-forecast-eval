name: analyze

on:
  schedule:
    - cron: "37 5,17 * * *"   # 2x daily, offset from the collect crons
  workflow_dispatch: {}

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests boto3 rasterio shapely
      # raw/ holds the synced ToA tifs + perimeters (~1GB/day of archive age);
      # the cache means most runs only download the delta from B2
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-analyze-${{ github.run_id }}
          restore-keys: raw-analyze-
      - name: Sync, analyze, publish metrics.csv to the bucket
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'fire-forecast-archive' }}
        run: python analyze.py --sync --publish
